<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>learnbash spike</title>
  <style>
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #111; color: #eee; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    #term { height: 420px; background: #000; padding: 4px; }
    button { font: inherit; padding: 6px 14px; margin-right: 8px; }
    #status { margin: 10px 0; min-height: 1.4em; }
    .pass { color: #6f6; } .fail { color: #f96; }
    pre { color: #999; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Spike: create <code>~/hello.txt</code> containing <code>hi</code></h1>
  <div id="term"></div>
  <div id="status">Loading VM…</div>
  <button id="check" disabled>Check</button>
  <button id="reset" disabled>Reset</button>
  <pre id="timings"></pre>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
